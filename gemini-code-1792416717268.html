<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast 訪談 AI 提詞機</title>
    <!-- 引入 Noto Sans TC 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- 引入 marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --highlight-color: #ffd700;
            --btn-color: #4a90e2;
            --btn-hover: #357abd;
            --border-color: #444;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 24px; color: #fff; }

        .settings {
            display: flex;
            gap: 10px;
        }

        input[type="password"] {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #111;
            color: #fff;
            width: 250px;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        .input-area {
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        textarea {
            flex-grow: 1;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #1a1a1a;
            color: #fff;
            font-size: 18px;
            resize: none;
            height: 80px;
            font-family: inherit;
        }

        button {
            padding: 0 30px;
            border: none;
            border-radius: 6px;
            background-color: var(--btn-color);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--btn-hover); }
        button:disabled { background-color: #666; cursor: not-allowed; }

        .output-area {
            flex-grow: 1;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 25px;
            overflow-y: auto;
            font-size: 22px; /* 大字體方便閱讀 */
            line-height: 1.6;
        }

        .output-area strong {
            color: var(--highlight-color);
            background-color: rgba(255, 215, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .loading {
            color: #aaa;
            font-style: italic;
            display: none;
        }

        .error-msg { color: #ff6b6b; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <h1>🎙️ 跨世代 Podcast AI 提詞機</h1>
        <div class="settings">
            <input type="password" id="apiKeyInput" placeholder="請輸入 Gemini API Key" />
            <button id="saveKeyBtn" style="font-size: 14px; padding: 0 15px;">儲存 Key</button>
        </div>
    </header>

    <div class="main-container">
        <div class="input-area">
            <textarea id="userInput" placeholder="場邊同學請輸入長輩剛說的話或提問（按 Shift + Enter 換行，直接按 Enter 發送）..."></textarea>
            <button id="sendBtn">產生<br>提詞</button>
        </div>

        <div class="output-area" id="outputArea">
            <div style="color: #888; text-align: center; margin-top: 50px; font-size: 18px;">
                等待輸入中... 生成的講稿會顯示在這裡。<br>
                請確保已在右上角填寫並儲存 API Key。
            </div>
        </div>
        <div class="output-area loading" id="loadingArea">
            大腦運轉中，正在產生回應台詞...
        </div>
    </div>

    <script>
        // 系統提示詞：定義 AI 的行為與輸出格式
        const SYSTEM_PROMPT = `
你是一位Podcast節目的「即時提詞大腦」。現在有三位台南南美里的長輩（秀炯姐、秀蓮姐、秀蘭姐）正在接受大學生主持人的訪問。
場邊的記錄人員會輸入長輩剛剛說的話或提出的問題。

請你立刻提供 2 到 3 種不同切入點的「主持人回應台詞」（例如：順著話題追問、幽默回應、對比現代年輕人生活）。
規則：
1. 必須是「可以直接朗讀的完整口語句子」。語氣要親切、敬重、自然，像是晚輩在請教長輩。
2. 每一種回應請給予一個簡單的情境標題（如：【順勢追問】、【對比現代】）。
3. **最重要：請將台詞中的【核心關鍵字或重點動作】用 Markdown 粗體（**字詞**）標示，讓主持人一眼就能抓到重點，不用逐字唸也能靈活發揮。**
4. 不要寫任何前言或結語，直接輸出台詞選項。
`;

        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const outputArea = document.getElementById('outputArea');
        const loadingArea = document.getElementById('loadingArea');

        // 載入已儲存的 API Key
        const savedKey = localStorage.getItem('geminiApiKey');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        // 儲存 API Key
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('geminiApiKey', key);
                alert('API Key 已儲存！');
            } else {
                alert('請輸入有效的 API Key');
            }
        });

        // 監聽 Enter 鍵發送 (Shift+Enter 換行)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateResponse();
            }
        });

        sendBtn.addEventListener('click', generateResponse);

        async function generateResponse() {
            const key = localStorage.getItem('geminiApiKey');
            const text = userInput.value.trim();

            if (!key) {
                alert('請先在右上角輸入並儲存 Gemini API Key！');
                apiKeyInput.focus();
                return;
            }
            if (!text) return;

            // UI 狀態切換
            outputArea.style.display = 'none';
            loadingArea.style.display = 'block';
            sendBtn.disabled = true;

            try {
                // 呼叫 Gemini 1.5 Flash API (速度最快，適合即時提詞)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: SYSTEM_PROMPT }]
                        },
                        contents: [{
                            parts: [{ text: text }]
                        }],
                        generationConfig: {
                            temperature: 0.7, // 保持適度靈活但不過於發散
                        }
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API 請求失敗');
                }

                const resultText = data.candidates[0].content.parts[0].text;
                
                // 使用 marked.js 解析 Markdown 並呈現
                outputArea.innerHTML = marked.parse(resultText);

                // 清空輸入框準備下一次輸入
                userInput.value = '';

            } catch (error) {
                outputArea.innerHTML = `<p class="error-msg">❌ 發生錯誤：${error.message}</p>`;
            } finally {
                loadingArea.style.display = 'none';
                outputArea.style.display = 'block';
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
